   </g>
   <g id="text_8">
    <text style="font-size: 8px; font-family: 'Calibri', sans-serif; fill: #263944" transform="translate(35.066835 196.576259)">Literature inputs of feed, farm electricity and bicarbonate</text>
    <text style="font-size: 8px; font-family: 'Calibri', sans-serif; fill: #263944" transform="translate(35.066835 208.976259)">Background from ecoinvent 3.11 Cut-off</text>
    <text style="font-size: 8px; font-family: 'Calibri', sans-serif; fill: #263944" transform="translate(35.066835 221.374384)">Explicit feed proxies, processing and delivery</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 9px; font-family: 'Calibri', sans-serif; text-anchor: start; fill: #397a86" x="35.066835" y="272.660031" transform="rotate(-0 35.066835 272.660031)">03</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 9px; font-family: 'Calibri', sans-serif; text-anchor: start; fill: #242b33" x="59.447622" y="272.660031" transform="rotate(-0 59.447622 272.660031)">Life cycle impact assessment (LCIA)</text>
   </g>
   <g id="text_11">
    <text style="font-size: 8px; font-family: 'Calibri', sans-serif; fill: #263944" transform="translate(35.066835 297.283139)">openLCA + Python with explicit unit validation</text>
