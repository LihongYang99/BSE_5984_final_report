   <g id="text_2">
    <text style="font-size: 8px; font-family: 'Calibri', sans-serif; text-anchor: start; fill: #59636d" x="25.31452" y="44.018268" transform="rotate(-0 25.31452 44.018268)">Scenario-based GWP screening of U.S. shrimp aquaculture</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 9px; font-family: 'Calibri', sans-serif; text-anchor: start; fill: #397a86" x="35.066835" y="71.218772" transform="rotate(-0 35.066835 71.218772)">01</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 9px; font-family: 'Calibri', sans-serif; text-anchor: start; fill: #242b33" x="59.447622" y="71.218772" transform="rotate(-0 59.447622 71.218772)">Goal and scope definition</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8px; font-family: 'Calibri', sans-serif; fill: #263944" transform="translate(35.066835 95.853754)">Functional unit of 1 kg live-weight shrimp</text>
    <text style="font-size: 8px; font-family: 'Calibri', sans-serif; fill: #263944" transform="translate(35.066835 108.253754)">Intended cradle-to-farm-gate boundary</text>
    <text style="font-size: 8px; font-family: 'Calibri', sans-serif; fill: #263944" transform="translate(35.066835 121.330004)">Indiana main case and Alabama counterfactual</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 9px; font-family: 'Calibri', sans-serif; text-anchor: start; fill: #397a86" x="35.066835" y="171.939402" transform="rotate(-0 35.066835 171.939402)">02</text>
   </g>
   <g id="text_7">
